[package]
name = "causarix-stylus-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Arbitrum Stylus High-Performance Merkle & SCM Variance Verifier for Causarix Fiduciary Governance"

[dependencies]
stylus-sdk = "0.6.0"
alloy-primitives = "=0.7.6"
alloy-sol-types = "=0.7.6"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
