# SYNAPS Vision-Language Document Engine Configuration

system:
  max_ram_usage_mb: 4096
  worker_threads: 4
  hardware_acceleration: "auto" # options: auto, cuda, metal, cpu
  log_level: "INFO"

rendering:
  target_resolution: [1024, 1024]
  dpi: 150
  adaptive_tiling: true
  tile_max_dimension: 2048
  image_format: "WEBP"
  quality: 85

memory:
  sliding_window_tokens: 128
  max_cache_entries: 500
  cache_eviction_strategy: "LRU"
  enable_embedding_reuse: true

inference:
  backend: "llama_cpp" # options: llama_cpp, ollama, mock
  model_name: "MiniCPM-V-2_6-GGUF"
  quantization: "Q4_K_M"
  llama_cpp_server_url: "http://localhost:8080"
  ollama_server_url: "http://localhost:11434"
  context_window: 4096
  temperature: 0.2
  top_p: 0.9

synaps:
  api_base_url: "http://localhost:3000"
  enable_auto_ingestion: true
  enable_knowledge_graph: true
  enable_decision_memory: true
