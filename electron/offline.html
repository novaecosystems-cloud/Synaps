<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synaps AI — Offline Resilience</title>
  <style>
    body {
      background-color: #070c18;
      color: #f3f3f3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      user-select: none;
    }
    .card {
      background: #0f1629;
      border: 1px solid #1f293d;
      padding: 40px 32px;
      border-radius: 24px;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(252, 71, 120, 0.1);
      border: 1px solid rgba(252, 71, 120, 0.3);
      color: #fc4778;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    .btn {
      background: #fc4778;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #ff5e8c;
    }
    .status {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Network Guardian</div>
    <h1>Connecting to Synaps OS...</h1>
    <p>Unable to connect to the cloud engine. If you are offline, local IndexedDB and air-gapped enclaves remain secure.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="status" id="status">Checking network status...</div>
  </div>

  <script>
    window.addEventListener('online', () => {
      document.getElementById('status').innerText = 'Network restored! Reconnecting...';
      setTimeout(() => window.location.reload(), 1500);
    });
    window.addEventListener('offline', () => {
      document.getElementById('status').innerText = 'Device is currently offline.';
    });
  </script>
</body>
</html>
