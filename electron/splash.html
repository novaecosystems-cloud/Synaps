<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causarix AI — Sovereign Decision OS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
      color: #FAFAFA;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    /* Prismatic Chromatic WebGL Shader Canvas */
    #shader-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.88;
    }

    /* Radial Vignette Overlay */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 25%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Central Content Container */
    .content-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 580px;
      padding: 24px;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Glowing Cyan Rounded-Square Badge */
    .logo-badge {
      width: 104px;
      height: 104px;
      border-radius: 28px;
      background: #0D111A;
      border: 1px solid rgba(6, 182, 212, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 50px rgba(6, 182, 212, 0.4), inset 0 0 20px rgba(6, 182, 212, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: pulseGlow 4s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 45px rgba(6, 182, 212, 0.35), inset 0 0 15px rgba(6, 182, 212, 0.1); }
      50% { box-shadow: 0 0 60px rgba(6, 182, 212, 0.55), inset 0 0 25px rgba(6, 182, 212, 0.2); }
    }

    .logo-badge img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      border-radius: 18px;
      filter: drop-shadow(0 0 16px rgba(6, 182, 212, 0.85));
    }

    /* Brand Typography */
    h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #FFFFFF;
      text-transform: uppercase;
      text-shadow: 0 0 35px rgba(6, 182, 212, 0.65), 0 0 10px rgba(6, 182, 212, 0.4);
    }

    .subtitle {
      font-size: 11px;
      color: #06B6D4;
      font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Ubuntu Mono', monospace;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 34px;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
    }

    /* Progress Bar */
    .progress-track {
      width: 340px;
      height: 4px;
      background: #18181B;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .progress-fill {
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, #06B6D4, #3B82F6, #10B981);
      border-radius: 99px;
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.9);
      transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Status Text & Percentage */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 340px;
      font-size: 10.5px;
      font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Ubuntu Mono', monospace;
      letter-spacing: 0.08em;
      color: #06B6D4;
      text-transform: uppercase;
    }

    #status-text {
      transition: opacity 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    #percent-text {
      font-weight: 700;
    }

    /* Skip Intro Button */
    .skip-btn {
      position: absolute;
      bottom: 24px;
      right: 28px;
      z-index: 30;
      color: #A1A1AA;
      background: rgba(24, 24, 27, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 11px;
      font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .skip-btn:hover {
      color: #FFFFFF;
      background: rgba(6, 182, 212, 0.2);
      border-color: #06B6D4;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.35);
      transform: translateY(-1px);
    }
  </style>
  <script src="three.min.js"></script>
</head>

    <h1>CAUSARIX</h1>
    <p class="subtitle">ADVANCED CAUSAL AI &bull; TECHNOLOGIES</p>
    
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    
    <div class="status-row">
      <span id="status-text">INITIALIZING CAUSARIX SCM ENGINE...</span>
      <span id="percent-text">25%</span>
    </div>
  </div>

  <button class="skip-btn" id="skip-btn" onclick="skipIntro()">Skip Intro &rarr;</button>

  <script>
    // Three.js Diagonal Chromatic Prismatic Shader
    (function initShader() {
      try {
        if (typeof THREE === 'undefined') {
          console.warn('[Splash] THREE.js not loaded, using background fallback.');
          return;
        }

        const container = document.getElementById('shader-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.Camera();
        camera.position.z = 1;

        const vertexShader = 'void main() { gl_Position = vec4(position, 1.0); }';

        const fragmentShader = `
          uniform vec2 resolution;
          uniform float time;

          void main() {
            vec2 p = -1.0 + 2.0 * gl_FragCoord.xy / resolution.xy;
            float a = time * 40.0;
            float d, e, f, g = 1.0 / 40.0, h, i, r, q;

            e = 400.0 * (p.x * 0.5 + 0.5);
            f = 400.0 * (p.y * 0.5 + 0.5);
            i = 200.0 + sin(e * g + a / 150.0) * 20.0;
            d = 200.0 + cos(f * g / 2.0) * 18.0 + cos(e * g) * 7.0;
            r = sqrt(pow(abs(i - e), 2.0) + pow(abs(d - f), 2.0));
            q = f / r;
            e = (r * cos(q)) - a / 2.0;
            f = (r * sin(q)) - a / 2.0;
            d = sin(e * g) * 176.0 + sin(e * g) * 164.0 + r;
            h = ((f + d) + a / 2.0) * g;
            i = cos(h + r * p.x / 1.3) * (e + e + a) + cos(q + g * 6.0) * (r + h / 3.0);
            h = sin(f * g) * 144.0 - sin(e * g) * 212.0 * p.x;
            h = (h + (f - e) * q + sin(r - (a + h) / 7.0) * 10.0 + i / 4.0) * g;
            i += cos(h * 2.3 * sin(a / 350.0 - q)) * 184.0 * sin(q - (r * 4.3 + a / 12.0) * g) + tan(r * g + h) * 184.0 * cos(r * g + h);
            i = mod(i / 5.6, 256.0) / 64.0;
            if (i < 0.0) i += 4.0;
            if (i >= 2.0) i = 4.0 - i;
            d = r / 350.0;
            d += sin(d * d * 8.0) * 0.52;
            f = (sin(a * g) + 1.0) / 2.0;
            gl_FragColor = vec4(vec3(f * i / 1.6, i / 2.0 + d / 13.0, i) * d * p.x + vec3(i / 1.3 + d / 8.0, i / 2.0 + d / 18.0, i) * d * (1.0 - p.x), 1.0);
          }
        `;

        const uniforms = {
          time: { value: 1.0 },
          resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const material = new THREE.ShaderMaterial({
          uniforms: uniforms,
          vertexShader: vertexShader,
          fragmentShader: fragmentShader
        });

        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(mesh);

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        
        function resize() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          renderer.setPixelRatio(pixelRatio);
          renderer.setSize(w, h);
          uniforms.resolution.value.set(renderer.domElement.width, renderer.domElement.height);
        }

        resize();
        container.appendChild(renderer.domElement);

        let lastTime = performance.now();
        function animate(now) {
          requestAnimationFrame(animate);
          const dt = (now - lastTime) * 0.001;
          lastTime = now;
          uniforms.time.value += (dt > 0 && dt < 0.1 ? dt * 1.8 : 0.03);
          renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);

        window.addEventListener('resize', resize, false);
      } catch (err) {
        console.warn('[Splash WebGL] Fallback activated:', err);
      }
    })();

    // 4-Stage Multi-Phase Status Stepper
    const stages = [
      { text: 'INITIALIZING CAUSARIX SCM ENGINE...', percent: '25%', width: '25%' },
      { text: 'LOADING 10-AGENT BOARDROOM QUORUM...', percent: '55%', width: '55%' },
      { text: 'VERIFYING CAUSAL GRAPH & SCM DO-CALCULUS...', percent: '88%', width: '88%' },
      { text: 'SOVEREIGN DECISION OS READY', percent: '100%', width: '100%' }
    ];

    let currentStage = 0;
    const statusTextEl = document.getElementById('status-text');
    const percentTextEl = document.getElementById('percent-text');
    const progressFillEl = document.getElementById('progress-fill');

    function updateStage() {
      currentStage = (currentStage + 1) % stages.length;
      const stage = stages[currentStage];
      
      statusTextEl.style.opacity = '0';
      setTimeout(() => {
        statusTextEl.innerText = stage.text;
        percentTextEl.innerText = stage.percent;
        progressFillEl.style.width = stage.width;
        statusTextEl.style.opacity = '1';
      }, 150);
    }

    const stageInterval = setInterval(updateStage, 1100);

    // Skip Intro Navigation
    function skipIntro() {
      clearInterval(stageInterval);
      window.location.href = 'http://localhost:3000/login';
    }
  </script>
