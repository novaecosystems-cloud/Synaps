<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Synaps Neural Gradient -->
    <linearGradient id="fullSynapsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="fullSecondaryGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Wordmark Ambient Accent -->
    <linearGradient id="textAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #00F2FE); }
    }
    .node-anim {
      transform-origin: center;
      animation: pulseNode 2.5s ease-in-out infinite;
    }
    .node-delay {
      animation-delay: 1.25s;
    }
  </style>

  <!-- 1. ICON EMBLEM (Interlocking Synapse S-Nexus) -->
  <g id="icon-mark" transform="translate(10, 5) scale(0.75)">
    <!-- Lower Loop -->
    <path 
      d="M 60,60 C 42,60 30,72 30,86 C 30,98 40,106 54,106 C 72,106 90,92 90,72 C 90,56 76,46 60,46"
      stroke="url(#fullSecondaryGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upper Loop -->
    <path 
      d="M 60,60 C 78,60 90,48 90,34 C 90,22 80,14 66,14 C 48,14 30,28 30,48 C 30,64 44,74 60,74"
      stroke="url(#fullSynapsGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#fullGlow)"
    />

    <!-- Inner Synapse Bridge -->
    <path 
      d="M 46,68 Q 60,60 74,52"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Interactive Pulse Nodes -->
    <circle class="node-anim" cx="66" cy="14" r="4.5" fill="#FFFFFF" stroke="#00F2FE" stroke-width="2.5" />
    <circle class="node-anim node-delay" cx="60" cy="60" r="5" fill="#00F2FE" stroke="#FFFFFF" stroke-width="2.5" />
    <circle class="node-anim" cx="54" cy="106" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- 2. GEOMETRIC WORDMARK: "SYNAPS" -->
  <g id="wordmark" transform="translate(110, 62)">
    <!-- Letter S -->
    <path d="M 28, -26 C 24, -30 18, -32 12, -32 C 3, -32 -4, -26 -4, -18 C -4, -9 5, -5 14, -2 C 25, 2 34, 7 34, 18 C 34, 28 25, 34 13, 34 C 4, 34 -4, 29 -9, 23" 
          stroke="url(#textAccentGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" />

    <!-- Letter Y -->
    <path d="M 44, -31 L 57, -8 L 70, -31 M 57, -8 L 57, 32" 
          stroke="url(#textAccentGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Letter N -->
    <path d="M 83, 32 L 83, -31 L 111, 32 L 111, -31" 
          stroke="url(#textAccentGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Letter A -->
    <path d="M 124, 32 L 140, -31 L 156, 32 M 130, 9 L 150, 9" 
          stroke="url(#textAccentGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Glowing AI Dot inside 'A' -->
    <circle cx="140" cy="-7" r="3.5" fill="#00F2FE" filter="url(#fullGlow)" />

    <!-- Letter P -->
    <path d="M 170, 32 L 170, -31 L 188, -31 C 199, -31 206, -24 206, -13 C 206, -2 199, 5 188, 5 L 170, 5" 
          stroke="url(#textAccentGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Letter S -->
    <path d="M 238, -26 C 234, -30 228, -32 222, -32 C 213, -32 206, -26 206, -18 C 206, -9 215, -5 224, -2 C 235, 2 244, 7 244, 18 C 244, 28 235, 34 223, 34 C 214, 34 206, 29 201, 23" 
          stroke="url(#textAccentGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- 3. TAGLINE: "ENTERPRISE INTELLIGENCE LAYER" -->
  <text x="112" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="3.5">
    ENTERPRISE INTELLIGENCE LAYER
  </text>
</svg>
