<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Synaps Neural Gradient (Cyan to Electric Blue to Emerald) -->
    <linearGradient id="synapsPrimaryGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Secondary Reverse Gradient for depth overlay -->
    <linearGradient id="synapsSecondaryGrad" x1="90%" y1="10%" x2="10%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="synapsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ambient Shadow -->
    <filter id="synapsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0088FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    /* CSS Animation Hooks for Motion Graphics / Web Animation */
    @keyframes synapsPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 8px #00F2FE); }
    }
    @keyframes synapsFlow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    .synaps-ribbon-upper {
      stroke-dasharray: 240;
      stroke-dashoffset: 0;
      transition: stroke 0.4s ease;
    }
    .synaps-node {
      transform-origin: center;
      animation: synapsPulse 3s ease-in-out infinite;
    }
    .synaps-node-delay {
      animation-delay: 1.5s;
    }
  </style>

  <g id="synaps-icon-mark" filter="url(#synapsShadow)">
    <!-- Lower Arc / Neural Synapse Loop -->
    <path 
      id="ribbon-lower"
      class="synaps-ribbon-lower"
      d="M 60,60 C 42,60 30,72 30,86 C 30,98 40,106 54,106 C 72,106 90,92 90,72 C 90,56 76,46 60,46"
      stroke="url(#synapsSecondaryGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upper Arc / Inverted Neural Loop (Forms the interlocking 'S') -->
    <path 
      id="ribbon-upper"
      class="synaps-ribbon-upper"
      d="M 60,60 C 78,60 90,48 90,34 C 90,22 80,14 66,14 C 48,14 30,28 30,48 C 30,64 44,74 60,74"
      stroke="url(#synapsPrimaryGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#synapsGlow)"
    />

    <!-- Central Nexus Bridge -->
    <path 
      id="nexus-bridge"
      d="M 46,68 Q 60,60 74,52"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Synapse Anchor Nodes (Interconnected Data Points) -->
    <!-- Top-Right Intake Node -->
    <circle 
      id="node-intake"
      class="synaps-node" 
      cx="66" 
      cy="14" 
      r="4.5" 
      fill="#FFFFFF" 
      stroke="#00F2FE" 
      stroke-width="2.5" 
    />

    <!-- Center Decision Nexus Node -->
    <circle 
      id="node-nexus"
      class="synaps-node synaps-node-delay" 
      cx="60" 
      cy="60" 
      r="5" 
      fill="#00F2FE" 
      stroke="#FFFFFF" 
      stroke-width="2.5" 
    />

    <!-- Bottom-Left Outcome Node -->
    <circle 
      id="node-outcome"
      class="synaps-node" 
      cx="54" 
      cy="106" 
      r="4.5" 
      fill="#10B981" 
      stroke="#FFFFFF" 
      stroke-width="2.5" 
    />
  </g>
</svg>
